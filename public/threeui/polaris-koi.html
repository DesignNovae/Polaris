<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Koi Studies — Interactive Card Stack</title>
  <style>
    :root {
      --field: #10100e;
      --paper: #eee6d0;
      --muted: #a39b88;
      --accent: #c95c3f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--field);
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 52% 42%, rgb(201 92 63 / 0.055), transparent 27rem),
        radial-gradient(circle at 45% 55%, rgb(238 230 208 / 0.035), transparent 40rem),
        var(--field);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 46%, transparent 16%, rgb(7 7 6 / 0.18) 100%),
        radial-gradient(circle at 52% 42%, rgb(201 92 63 / 0.065), transparent 30rem),
        linear-gradient(rgb(34 31 25 / 0.16), rgb(17 18 15 / 0.22));
      pointer-events: none;
    }

    .fluid-pastels-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
      background: var(--field);
      pointer-events: none;
      contain: strict;
    }

    .stack-scene {
      position: relative;
      z-index: 2;
      width: min(26.40625vw, 46.94444vh);
      aspect-ratio: 676 / 1010;
      perspective: 900px;
      container-type: inline-size;
      isolation: isolate;
    }

    .orbital-field {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 0;
      width: 220%;
      aspect-ratio: 1;
      pointer-events: none;
      translate: -50% -50%;
    }

    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--orbit-size);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(
        from var(--orbit-angle),
        transparent 0 13%,
        rgb(238 230 208 / 0.07) 19%,
        rgb(238 230 208 / 0.26) 27%,
        rgb(201 92 63 / 0.24) 34%,
        transparent 45% 67%,
        rgb(238 230 208 / 0.17) 76%,
        transparent 88%
      );
      opacity: var(--orbit-opacity);
      translate: -50% -50%;
      rotate: 0deg;
      -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - var(--orbit-line)),
        #000 calc(100% - var(--orbit-line) + 0.75px)
      );
      mask: radial-gradient(
        farthest-side,
        transparent calc(100% - var(--orbit-line)),
        #000 calc(100% - var(--orbit-line) + 0.75px)
      );
      animation: orbit-spin var(--orbit-speed) linear infinite;
      will-change: rotate;
    }

    .orbit-one {
      --orbit-size: 58%;
      --orbit-line: 1.5px;
      --orbit-angle: 18deg;
      --orbit-opacity: 0.9;
      --orbit-speed: 18s;
    }

    .orbit-two {
      --orbit-size: 79%;
      --orbit-line: 1px;
      --orbit-angle: 154deg;
      --orbit-opacity: 0.7;
      --orbit-speed: 27s;
      animation-direction: reverse;
    }

    .orbit-three {
      --orbit-size: 100%;
      --orbit-line: 1px;
      --orbit-angle: 252deg;
      --orbit-opacity: 0.5;
      --orbit-speed: 36s;
    }

    @keyframes orbit-spin {
      to {
        rotate: 360deg;
      }
    }

    .stack {
      position: absolute;
      inset: 0;
      z-index: 1;
      transform-style: preserve-3d;
    }

    .stack-shell {
      --stack-x: 0%;
      --stack-y: 0%;
      --stack-z: 0px;
      position: absolute;
      inset: 0;
      cursor: grab;
      outline: none;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      transform: translate3d(var(--stack-x), var(--stack-y), var(--stack-z));
      transform-style: preserve-3d;
      transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .drag-plane {
      --drag-x: 0px;
      --drag-y: 0px;
      --drag-turn: 0deg;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --release-blur: 0px;
      position: absolute;
      inset: 0;
      transform:
        translate3d(var(--drag-x), var(--drag-y), 0)
        rotateX(var(--tilt-x))
        rotateY(var(--tilt-y))
        rotateZ(var(--drag-turn));
      filter: blur(var(--release-blur));
      transform-style: preserve-3d;
      transition:
        transform 300ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 180ms ease,
        filter 140ms ease;
      will-change: transform, opacity, filter;
    }

    .stack-shell.is-tracking .drag-plane {
      transition-duration: 70ms;
      transition-timing-function: linear;
    }

    .stack-shell.is-dragging {
      cursor: grabbing;
    }

    .stack-shell.is-dragging .drag-plane {
      transition: none;
    }

    .stack-shell.is-releasing .drag-plane {
      transition:
        transform 180ms cubic-bezier(0.32, 0, 0.2, 1),
        opacity 90ms ease-out,
        filter 120ms ease-out;
    }

    .artwork {
      --panel: #211914;
      --ink: var(--paper);
      --accent-card: var(--accent);
      --stack-rotation: 0deg;
      --stack-scale: 1;
      position: absolute;
      inset: 0;
      overflow: hidden;
      container-type: inline-size;
      background: var(--panel);
      border-radius: clamp(20px, 2vw, 30px);
      box-shadow:
        0 2.6cqw 6.5cqw rgb(0 0 0 / 0.38),
        inset 0 0 0 1px rgb(255 255 255 / 0.1);
      transform:
        rotateZ(var(--stack-rotation))
        scale(var(--stack-scale));
      transform-origin: 90% 90%;
      transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 220ms ease;
      will-change: transform;
      -webkit-user-drag: none;
    }

    .artwork::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        145deg,
        rgb(255 255 255 / 0.22),
        rgb(238 230 208 / 0.11) 42%,
        rgb(255 255 255 / 0.035) 72%,
        rgb(201 92 63 / 0.19)
      );
      pointer-events: none;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .image-field {
      position: absolute;
      inset: 0 0 auto;
      width: 100%;
      height: 63.76238%;
      display: block;
      background: var(--panel);
      pointer-events: none;
    }

    .media-source {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .copy-panel {
      position: absolute;
      inset: 63.76238% 0 0;
      background: var(--panel);
      color: var(--ink);
      box-shadow: inset 0 1px rgb(238 230 208 / 0.09);
    }

    .copy-panel::before {
      content: "";
      position: absolute;
      inset: -10% 16% 5% -12%;
      background:
        radial-gradient(ellipse at 24% 48%, var(--accent-card), transparent 44%),
        radial-gradient(ellipse at 58% 62%, rgb(238 230 208 / 0.16), transparent 52%);
      opacity: 0;
      filter: blur(1.8cqw);
      mix-blend-mode: screen;
      pointer-events: none;
      transform-origin: 18% 52%;
    }

    .copy {
      position: absolute;
      top: 23.5%;
      left: 6.7%;
      margin: 0;
      font-family: Iowan Old Style, Baskerville, "Times New Roman", serif;
      font-size: 9.05cqw;
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .word-reveal {
      display: inline-block;
      padding: 0.12em 0.035em;
      margin: -0.12em -0.035em;
      vertical-align: bottom;
    }

    .reveal-word {
      display: inline-block;
    }

    .brand-lockup {
      position: absolute;
      right: 5.62%;
      bottom: 5.15cqw;
      display: flex;
      align-items: center;
      gap: 1.45cqw;
      color: var(--ink);
    }

    .wordmark {
      font-size: 2.05cqw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hanko {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 9.3cqw;
      height: 9.3cqw;
      overflow: hidden;
      color: var(--panel);
      background:
        radial-gradient(circle at 13% 24%, rgb(18 17 14 / 0.42) 0 0.26cqw, transparent 0.35cqw),
        radial-gradient(circle at 78% 17%, rgb(18 17 14 / 0.34) 0 0.2cqw, transparent 0.3cqw),
        radial-gradient(circle at 68% 82%, rgb(18 17 14 / 0.38) 0 0.24cqw, transparent 0.34cqw),
        radial-gradient(circle at 27% 74%, rgb(18 17 14 / 0.3) 0 0.17cqw, transparent 0.27cqw),
        #c64b35;
      border-radius: 1.05cqw 0.72cqw 1.18cqw 0.82cqw;
      box-shadow:
        inset 0 0 0 0.28cqw rgb(18 17 14 / 0.2),
        inset 0.32cqw -0.25cqw 0.7cqw rgb(18 17 14 / 0.16),
        0 0.45cqw 1.25cqw rgb(0 0 0 / 0.16);
      filter: saturate(0.96);
      transform: rotate(-2.4deg);
    }

    .hanko::before {
      content: "";
      position: absolute;
      inset: 0.72cqw;
      border: 0.26cqw solid currentColor;
      border-radius: 0.42cqw 0.26cqw 0.52cqw 0.22cqw;
      opacity: 0.82;
    }

    .hanko::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(103deg, transparent 0 42%, rgb(18 17 14 / 0.14) 44% 46%, transparent 48%),
        radial-gradient(ellipse at 22% 13%, rgb(18 17 14 / 0.22) 0 0.42cqw, transparent 0.58cqw),
        radial-gradient(ellipse at 89% 62%, rgb(18 17 14 / 0.22) 0 0.45cqw, transparent 0.62cqw);
      mix-blend-mode: multiply;
    }

    .hanko span {
      position: relative;
      z-index: 1;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Songti SC", serif;
      font-size: 3.38cqw;
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.14em;
      transform: translateY(-0.03em);
    }

    .hanko-shusui {
      transform: rotate(1.8deg);
    }

    .hanko-utsuri {
      transform: rotate(-1.1deg);
    }

    .stack-scene.reveal-enabled .reveal-word,
    .stack-scene.reveal-enabled .reveal-lockup {
      opacity: 0;
      filter: blur(0.32em);
      translate: 0 0.72em;
    }

    .stack-scene.reveal-enabled .reveal-lockup {
      scale: 0.92;
    }

    .stack-scene.reveal-enabled .stack-shell.is-active .copy-panel::before {
      animation: paper-wash-bloom 1.25s cubic-bezier(0.16, 1, 0.3, 1) 140ms both;
    }

    .stack-scene.reveal-enabled .stack-shell.is-active .reveal-word {
      animation: word-ink-in 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(250ms + var(--reveal-index) * 68ms);
      will-change: opacity, filter, translate;
    }

    .stack-scene.reveal-enabled .stack-shell.is-active .reveal-lockup {
      animation: lockup-ink-in 660ms cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(285ms + var(--reveal-index) * 68ms);
      will-change: opacity, filter, translate, scale;
    }

    @keyframes word-ink-in {
      from {
        opacity: 0;
        filter: blur(0.32em);
        translate: 0 0.72em;
      }

      to {
        opacity: 1;
        filter: blur(0);
        translate: 0 0;
      }
    }

    @keyframes lockup-ink-in {
      from {
        opacity: 0;
        filter: blur(0.32em);
        translate: 0 0.72em;
        scale: 0.92;
      }

      to {
        opacity: 1;
        filter: blur(0);
        translate: 0 0;
        scale: 1;
      }
    }

    @keyframes paper-wash-bloom {
      0% {
        opacity: 0;
        translate: -8% 5%;
        scale: 0.52;
      }

      55% {
        opacity: 0.16;
      }

      100% {
        opacity: 0.045;
        translate: 1% 0;
        scale: 1.12;
      }
    }

    .interaction-hint {
      position: absolute;
      left: 50%;
      top: calc(100% + clamp(28px, 4.5vh, 52px));
      z-index: 2;
      margin: 0;
      color: rgb(238 230 208 / 0.5);
      font-size: clamp(9px, 0.72vw, 12px);
      font-weight: 500;
      letter-spacing: 0.18em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      transform: translateX(-50%);
      transition: opacity 260ms ease;
    }

    .stack-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .stack-scene[data-interacted="true"] .interaction-hint {
      opacity: 0;
    }

    @media (max-aspect-ratio: 3 / 4) {
      .stack-scene {
        width: min(72vw, 44vh);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stack-shell,
      .artwork,
      .interaction-hint {
        transition-duration: 1ms;
      }

      .orbit {
        animation: none;
      }

      .orbit-one {
        rotate: 22deg;
      }

      .orbit-two {
        rotate: 148deg;
      }

      .orbit-three {
        rotate: 276deg;
      }

      .image-field {
        image-rendering: auto;
      }

      .stack-scene.reveal-enabled .reveal-word,
      .stack-scene.reveal-enabled .reveal-lockup {
        opacity: 1;
        filter: none;
        translate: none;
        scale: 1;
        animation: none;
      }

      .stack-scene.reveal-enabled .copy-panel::before {
        display: none;
      }
    }

    @media (forced-colors: active) {
      .fluid-pastels-background,
      .orbital-field {
        display: none;
      }
    }
  </style>
<style>:root { --field: transparent; --paper: #faf6f0; --muted: #c4b2a5; --accent: #b8546a; }
html, body { background: transparent; color-scheme: light; }
body::before, .fluid-pastels-background, .orbital-field { display: none; }
.stack-scene { width: min(66vw, 52vh); }
.artwork { --panel: #342219 !important; --ink: #faf6f0 !important; --accent-card: #b8546a !important; }
.image-field { height: 58%; }
.copy-panel { inset: 58% 0 0; display: flex; flex-direction: column; padding: 5cqw 6.7cqw 3.5cqw; }
.copy { position: static; font-size: 7.5cqw; line-height: 1.05; letter-spacing: -.025em; margin: 0; }
.polaris-detail { position: static; margin: 4cqw 0 3cqw; color: #ddcfc3; font-size: 4.2cqw; line-height: 1.45; }
.brand-lockup { display: none; }
.polaris-controls { display: flex; align-items: center; justify-content: space-between; margin-top: auto; font-size: 12px; }
.polaris-controls button { width: 40px; height: 40px; border: 1px solid #795543; border-radius: 50%; background: transparent; color: #faf6f0; font-size: 18px; cursor: pointer; }
.polaris-explore { align-self: flex-start; margin-top: auto; border: 0; background: transparent; color: #f4c6d2; font-size: 12px; min-height: 38px; padding: 6px 0; cursor: pointer; }
.polaris-controls button:hover,.polaris-explore:hover { background: #58392c; }
.polaris-controls button:focus-visible,.polaris-explore:focus-visible { outline: 3px solid #d58ca0; outline-offset: 2px; }
.polaris-close { position: absolute; z-index: 8; top: 10px; right: 10px; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; background: #2c1810; color: #faf6f0; font: 22px/1 Inter, sans-serif; cursor: pointer; touch-action: manipulation; }
.polaris-close::before { content: ""; position: absolute; inset: -7px; }
.stack-shell { cursor: default; touch-action: pan-y; }
.polaris-close:hover { background: #58392c; }
.polaris-close:focus-visible { outline: 3px solid #d58ca0; outline-offset: 3px; }
.polaris-close,.polaris-explore { opacity: 0; pointer-events: none; }
.hanko { width: 5cqw; height: 5cqw; background: #b8546a; }
.hanko span { display: none; }
.hanko::before { border: 0; background: #faf6f0; clip-path: polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); }
.interaction-hint { display: none; }
.stack-shell:focus-visible .artwork { outline: 3px solid #d58ca0; outline-offset: 5px; }
@media(max-width: 480px) { .stack-scene { width: min(66vw, 52vh); } }
</style></head>
<body>
  <canvas
    id="fluid-pastels-background"
    class="fluid-pastels-background"
    data-preset-id="48b986ff-956f-43a4-8306-c4e915a51371"
    aria-hidden="true"
  ></canvas>
  <main class="stack-scene" aria-label="Three interactive Japanese koi studies" data-interacted="false">
    <div class="orbital-field" aria-hidden="true">
      <span class="orbit orbit-one"></span>
      <span class="orbit orbit-two"></span>
      <span class="orbit orbit-three"></span>
    </div>
    <div class="stack" role="group" aria-label="Drag left for the next card or right for the previous card. Tap for next. Use the Left and Right Arrow keys.">
      <div
        class="stack-shell"
        data-card-id="0"
        data-name="Kōhaku"
        role="button"
        tabindex="0"
        aria-label="Kōhaku: Move like water, keep the fire quiet. Drag left for next or right for previous."
      >
        <div class="drag-plane">
          <article class="artwork" style="--panel: #211914; --ink: #eee6d0; --accent-card: #c95c3f;">
            <canvas class="image-field" width="676" height="644" aria-hidden="true"></canvas>
            <section class="copy-panel" aria-label="Move like water, keep the fire quiet.">
              <p class="copy" aria-hidden="true"><span class="word-reveal"><span class="reveal-word" style="--reveal-index: 0">Move</span></span> <span class="word-reveal"><span class="reveal-word" style="--reveal-index: 1">like</span></span> <span class="word-reveal"><span class="reveal-word" style="--reveal-index: 2">water,</span></span><br><span class="word-reveal"><span class="reveal-word" style="--reveal-index: 3">keep</span></span> <span class="word-reveal"><span class="reveal-word" style="--reveal-index: 4">the</span></span> <span class="word-reveal"><span class="reveal-word" style="--reveal-index: 5">fire</span></span><br><span class="word-reveal"><span class="reveal-word" style="--reveal-index: 6">quiet.</span></span></p>
              <div class="brand-lockup" aria-label="Kōhaku">
                <span class="wordmark reveal-lockup" style="--reveal-index: 7">Kōhaku</span>
                <span class="hanko hanko-kohaku reveal-lockup" style="--reveal-index: 8" aria-hidden="true"><span lang="ja">紅白</span></span>
              </div>
            </section>
          </article>
        </div>
      </div>

    </div>
    <p class="interaction-hint" aria-hidden="true">← drag next · tap next · drag previous →</p>
    <p class="stack-status" aria-live="polite" aria-atomic="true"></p>
  </main>

  <script type="module">
    (() => {
      "use strict";

      const canvas = document.getElementById("fluid-pastels-background");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let shader = null;

      const setShaderStatus = status => {
        document.documentElement.dataset.shaderStatus = status;
        canvas.dataset.status = status;
      };

      const syncShaderMotion = () => {
        if (!shader) return;
        if (reducedMotion.matches) {
          shader.pause();
        } else {
          shader.resume();
        }
      };

      const destroyShader = () => {
        shader?.destroy();
        shader = null;
      };

      const mountFluidPastels = async () => {
        setShaderStatus("loading");

        try {
          const { createShader } = await import(
            "https://cdn.jsdelivr.net/npm/shaders@3.0.445/dist/js/bundle.js"
          );

          shader = await createShader(canvas, {
            components: [
              {
                type: "Swirl",
                id: "idmrwh8u6hvgbn3rwjx",
                props: {
                  colorSpace: "oklab",
                  detail: 0.6,
                  stops: [
                    { color: "#2c1810", position: 0 },
                    { color: "#684734", position: 1 }
                  ]
                }
              },
              {
                type: "FractalNoise",
                id: "idmrwhatezyhvgvxzo3",
                props: {
                  angle: -32,
                  blendMode: "multiply",
                  contrast: 0.54,
                  detail: 2.2,
                  octaves: 1,
                  opacity: 0.34,
                  seed: 53,
                  speed: 0.57,
                  stops: [
                    { color: "#000000", position: 0 },
                    { color: "#ffffff", position: 1 }
                  ]
                }
              },
              {
                type: "CursorRipples",
                id: "idmrwh98igg4699xm3s",
                props: {
                  chromaticSplit: 0,
                  decay: 3.3,
                  intensity: 17.4,
                  radius: 1
                }
              },
              {
                type: "Watercolor",
                id: "idmrwhd8e9y2ec3yhv9",
                props: {
                  bleed: 2.9,
                  paper: 0.07
                }
              }
            ]
          }, {
            toneMapping: "cineon",
            disableTelemetry: true,
            onReady: () => {
              setShaderStatus("ready");
              syncShaderMotion();
            },
            onError: error => {
              setShaderStatus("fallback");
              console.warn("Fluid Pastels shader unavailable; using the CSS background.", error);
            }
          });

          window.__fluidPastelsShader = shader;
          syncShaderMotion();
        } catch (error) {
          setShaderStatus("fallback");
          console.warn("Fluid Pastels shader failed to load; using the CSS background.", error);
        }
      };

      reducedMotion.addEventListener?.("change", syncShaderMotion);
      window.addEventListener("pagehide", destroyShader, { once: true });
      // Full-page backdrop is omitted in the compact Polaris stack.
    })();
  </script>

  <script>
    (() => {

      const syncAnimation = () => {
        syncVideoPlayback();
        const shouldRun = shouldAnimateCanvas();

        if (!shouldRun) {
          if (animationFrame) cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          for (const card of cards) drawStatic(card);
          return;
        }

        if (!animationFrame) {
          lastFrameTime = performance.now();
          animationFrame = requestAnimationFrame(render);
        }
      };

      const updatePointerField = event => {
        if (!canAnimateField() || (event.pointerType && event.pointerType !== "mouse")) return;

        const card = topCard();
        const now = performance.now();
        const rect = card.canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;
        const elapsed = Math.max(8, now - card.pointer.lastMove);
        const distance = Math.hypot(x - card.pointer.x, y - card.pointer.y);
        const speed = clamp(distance * 1000 / elapsed / 2.2, 0, 1);
        const globalX = clamp(event.clientX / window.innerWidth, 0, 1);
        const globalY = clamp(event.clientY / window.innerHeight, 0, 1);
        const phase = clamp(globalX * 0.72 + (1 - globalY) * 0.28, 0, 1);

        card.pointer.hasInteracted = true;
        card.pointer.lastMove = now;
        card.pointer.speed = speed;
        card.pointer.targetFrame = phase * (FRAME_COUNT - 1);
        card.pointer.x = x;
        card.pointer.y = y;

        if (x > -0.3 && x < 1.3 && y > -0.3 && y < 1.3) {
          card.trail.unshift({
            life: 1,
            radius: 0.105 + speed * 0.115,
            x,
            y
          });

          if (card.trail.length > MAX_TRAIL_POINTS) {
            card.trail.length = MAX_TRAIL_POINTS;
          }
        }

        syncAnimation();
      };

      const updatePointerTilt = event => {
        if (!finePointer.matches || reducedMotion.matches || activeDrag || transitioning) return;

        const card = topCard();
        const rect = scene.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;
        const isNear = x > -0.22 && x < 1.22 && y > -0.18 && y < 1.18;

        if (!isNear) {
          card.shell.classList.remove("is-tracking");
          setShellTransform(card);
          return;
        }

        const tiltX = clamp((0.5 - y) * 10, -4.75, 4.75);
        const tiltY = clamp((x - 0.5) * 10, -4.75, 4.75);
        card.shell.classList.add("is-tracking");
        setShellTransform(card, 0, 0, tiltX, tiltY, 0);
      };

      const markInteracted = () => {
        scene.dataset.interacted = "true";
      };

      const getDragCommitThreshold = () =>
        clamp(scene.getBoundingClientRect().width * 0.18, 52, 88);

      const getCommittedDirection = (x, y, threshold) => {
        const hasHorizontalIntent = Math.abs(x) >= Math.abs(y) * 0.75;
        return Math.abs(x) >= threshold && hasHorizontalIntent
          ? Math.sign(x)
          : 0;
      };

      const sendToBack = (card, vectorX = 1, vectorY = 0) => { if (cards.length === 1) return;
        if (transitioning || card !== topCard()) return;

        markInteracted();
        transitioning = true;
        const magnitude = Math.max(1, Math.hypot(vectorX, vectorY));
        const directionX = vectorX / magnitude;
        const directionY = vectorY / magnitude;
        const distance = Math.max(190, scene.getBoundingClientRect().width * 0.66);
        const duration = reducedMotion.matches ? 0 : 180;
        const incoming = cards[order[order.length - 2]];

        card.shell.classList.remove("is-dragging", "is-tracking");
        card.shell.classList.add("is-releasing");
        setShellTransform(
          card,
          directionX * distance,
          directionY * distance * 0.58,
          -directionY * 7,
          directionX * 8,
          directionX * 9
        );
        card.dragPlane.style.opacity = duration ? "0" : "";
        card.dragPlane.style.setProperty(
          "--release-blur",
          duration ? "16px" : "0px"
        );

        window.setTimeout(() => {
          const hadFocus = document.activeElement === card.shell;
          order = [card.id, ...order.filter(id => id !== card.id)];
          card.shell.style.transition = "none";
          card.dragPlane.style.transition = "none";
          incoming.shell.style.transition = "none";
          incoming.dragPlane.style.transition = "none";
          resetShellTransform(card);
          updateStack();

          void incoming.shell.offsetWidth;
          card.shell.style.transition = "";
          card.dragPlane.style.transition = "";
          incoming.shell.style.transition = "";
          incoming.dragPlane.style.transition = "";
          transitioning = false;

          if (hadFocus) incoming.shell.focus({ preventScroll: true });
        }, duration);
      };

      const bringPreviousToFront = () => { if (cards.length === 1) return;
        if (transitioning) return;

        markInteracted();
        transitioning = true;
        const outgoing = topCard();
        const incoming = cards[order[0]];
        const hadFocus = document.activeElement === outgoing.shell;
        const distance = Math.max(190, scene.getBoundingClientRect().width * 0.66);
        const duration = reducedMotion.matches ? 0 : 360;

        incoming.shell.style.transition = "none";
        incoming.dragPlane.style.transition = "none";
        setShellTransform(incoming, -distance, 0, 0, -6, -8);
        incoming.dragPlane.style.opacity = duration ? "0.12" : "";
        order = [...order.slice(1), incoming.id];
        updateStack();
        void incoming.shell.offsetWidth;
        incoming.shell.style.transition = "";
        incoming.dragPlane.style.transition = "";

        const reveal = () => {
          setShellTransform(incoming);
          incoming.dragPlane.style.opacity = "";
        };

        const finish = () => {
          transitioning = false;
          if (hadFocus) incoming.shell.focus({ preventScroll: true });
        };

        if (duration) {
          window.setTimeout(reveal, 18);
          window.setTimeout(finish, duration);
        } else {
          reveal();
          finish();
        }
      };

      const cancelDrag = event => {
        if (
          !activeDrag ||
          (event?.pointerId !== undefined && event.pointerId !== activeDrag.pointerId)
        ) {
          return;
        }

        const { card, pointerId } = activeDrag;
        activeDrag = null;

        try {
          if (card.shell.hasPointerCapture?.(pointerId)) {
            card.shell.releasePointerCapture(pointerId);
          }
        } catch {
          // Pointer cancellation may release capture before this cleanup runs.
        }

        card.shell.classList.remove("is-dragging");
        setShellTransform(card);
      };

      const handlePointerDown = (card, event) => { if (cards.length === 1) return;
        if (
          card !== topCard() ||
          transitioning ||
          (event.button !== undefined && event.button !== 0)
        ) {
          return;
        }

        activeDrag = {
          card,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          committedDirection: 0,
          traveled: 0
        };
        card.shell.classList.remove("is-tracking");
        card.shell.classList.add("is-dragging");
        card.shell.focus({ preventScroll: true });

        try {
          card.shell.setPointerCapture?.(event.pointerId);
        } catch {
          cancelDrag(event);
          return;
        }

        event.preventDefault();
      };

      const handleDragPointerMove = (card, event) => {
        if (
          !activeDrag ||
          activeDrag.card !== card ||
          event.pointerId !== activeDrag.pointerId
        ) {
          return;
        }

        const x = event.clientX - activeDrag.startX;
        const y = event.clientY - activeDrag.startY;
        const width = Math.max(1, scene.getBoundingClientRect().width);
        const turn = clamp(x / width * 11, -12, 12);
        const committedDirection = getCommittedDirection(
          x,
          y,
          getDragCommitThreshold()
        );

        activeDrag.traveled = Math.max(activeDrag.traveled, Math.hypot(x, y));
        if (committedDirection) {
          activeDrag.committedDirection = committedDirection;
        }
        setShellTransform(
          card,
          x,
          y,
          clamp(-y / width * 6, -6, 6),
          clamp(x / width * 7, -7, 7),
          turn
        );
        markInteracted();
        event.preventDefault();
      };

      const handlePointerMove = event => {
        updatePointerField(event);
        updatePointerTilt(event);
      };

      const handlePointerUp = (card, event) => {
        if (
          !activeDrag ||
          activeDrag.card !== card ||
          event.pointerId !== activeDrag.pointerId
        ) {
          return;
        }

        const {
          committedDirection: latchedDirection,
          startX,
          startY,
          traveled
        } = activeDrag;
        const x = event.clientX - startX;
        const y = event.clientY - startY;
        const threshold = getDragCommitThreshold();
        const tapSlop = 3;
        const dropDistance = Math.hypot(x, y);
        const releaseDirection = getCommittedDirection(x, y, threshold);
        const committedDirection = releaseDirection || latchedDirection;
        const isTap = traveled <= tapSlop && dropDistance <= tapSlop;
        activeDrag = null;

        try {
          if (card.shell.hasPointerCapture?.(event.pointerId)) {
            card.shell.releasePointerCapture(event.pointerId);
          }
        } catch {
          // The drag has already ended; the visual reset below is authoritative.
        }

        card.shell.classList.remove("is-dragging");
        card.suppressClickUntil = performance.now() + 360;

        if (committedDirection) {
          if (committedDirection < 0) {
            sendToBack(card, -1, 0);
          } else {
            bringPreviousToFront();
          }
        } else if (isTap) {
          sendToBack(card, x || 1, y);
        } else {
          setShellTransform(card);
        }

        event.preventDefault();
      };

      const handleGlobalKeyDown = event => {
        const tagName = event.target?.tagName;
        const isTyping =
          event.target?.isContentEditable ||
          tagName === "INPUT" ||
          tagName === "TEXTAREA" ||
          tagName === "SELECT";

        if (isTyping || event.metaKey || event.ctrlKey || event.altKey) return;

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          bringPreviousToFront();
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          sendToBack(topCard(), 1, 0);
        }
      };

      const observer = "IntersectionObserver" in window
        ? new IntersectionObserver(entries => {
            inView = entries[0]?.isIntersecting ?? true;
            syncAnimation();
          }, { rootMargin: "100px" })
        : null;

      for (const card of cards) {
        card.context.imageSmoothingEnabled = true;
        card.image.addEventListener("load", () => {
          card.imageReady = true;
          card.imageUsable = true;
          drawStatic(card);
          startInitialPixelReveal();
          syncAnimation();
        }, { once: true });

        card.image.addEventListener("error", () => {
          card.imageReady = true;
          card.context.fillStyle = card.panelColor;
          card.context.fillRect(0, 0, WIDTH, HEIGHT);
          startInitialPixelReveal();
          syncAnimation();
        }, { once: true });

        card.video.addEventListener("loadeddata", () => {
          card.videoUsable = true;
          drawStatic(card);
          syncAnimation();
        }, { once: true });

        card.video.addEventListener("error", () => {
          card.videoUsable = false;
          syncAnimation();
        }, { once: true });

        card.shell.addEventListener("pointerdown", event => {
          handlePointerDown(card, event);
        });
        card.shell.addEventListener("lostpointercapture", cancelDrag);
        card.shell.addEventListener("click", () => {
          if (performance.now() >= card.suppressClickUntil) {
            sendToBack(card, 1, 0);
          }
        });
        card.shell.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            sendToBack(card, 1, 0);
          }
        });

        // Module image arrives from the host.
        // No koi video in the module view.
        // Preserve the canvas mask animation without a video source.
      }

      // Polaris single-module card; original tilt, media and reveal renderer retained.
      const applyModule = entry => {
        if (!entry || typeof entry.name !== "string" || typeof entry.description !== "string") return;
        const card = cards[0];
        if (typeof entry.icon === "string" && entry.icon.startsWith("data:image/png;base64,") && card.moduleIcon !== entry.icon) {
          card.moduleIcon = entry.icon;
          const icon = new Image();
          icon.onload = () => {
            const art = document.createElement("canvas"); art.width = WIDTH; art.height = HEIGHT;
            const paint = art.getContext("2d");
            const tones = ["#d8b48c", "#ca899c", "#9aaa91", "#c6a56c", "#d49baa", "#cbb67c", "#9fb4bb", "#b3a1c4"];
            const stock = paint.createLinearGradient(0, 0, WIDTH, HEIGHT);
            stock.addColorStop(0, "#faf6f0"); stock.addColorStop(1, tones[entry.index % tones.length] || tones[0]);
            paint.fillStyle = stock; paint.fillRect(0, 0, WIDTH, HEIGHT);
            // A printed field under the sculptural module emblem, revealed by the original mask.
            for (let y = 0; y < HEIGHT; y += 6) for (let x = 0; x < WIDTH; x += 6) {
              paint.fillStyle = `rgba(70,39,24,${.025 + (Math.sin(x * .12 + y * .09) + 1) * .025})`;
              paint.beginPath(); paint.arc(x, y, 1, 0, Math.PI * 2); paint.fill();
            }
            paint.save(); paint.shadowColor = "rgba(44,24,16,.3)"; paint.shadowBlur = 28; paint.shadowOffsetY = 24;
            paint.drawImage(icon, 78, 52, 520, 520); paint.restore();
            card.image.src = art.toDataURL("image/png");
          };
          icon.src = entry.icon;
        }
        card.shell.dataset.name = entry.name;
        card.shell.setAttribute("role", "group");
        card.shell.setAttribute("aria-label", entry.name + ". " + entry.description);
        const copy = card.shell.querySelector(".copy");
        copy.replaceChildren();
        const title = document.createElement("span"); title.className = "reveal-word"; title.textContent = entry.name;
        copy.append(title);
        const panel = card.shell.querySelector(".copy-panel");
        panel.setAttribute("aria-label", entry.name + ". " + entry.description);
        let paragraph = panel.querySelector(".polaris-detail");
        if (!paragraph) {
          paragraph = document.createElement("p"); paragraph.className = "polaris-detail"; panel.append(paragraph);
          const explore = document.createElement("button"); explore.className = "polaris-explore";
          explore.addEventListener("click", event => { event.stopPropagation(); parent.postMessage({ polarisExplore: true }, "*"); });
          panel.append(explore);
          const close = document.createElement("button"); close.className = "polaris-close";
          close.type = "button"; close.textContent = "×"; close.setAttribute("aria-label", "Close module details");
          close.addEventListener("click", event => { event.stopPropagation(); parent.postMessage({ polarisClose: true }, "*"); });
          card.dragPlane.append(close);
          [explore, close].forEach(control => { control.tabIndex = -1; control.setAttribute("aria-hidden", "true"); });
        }
        paragraph.textContent = entry.description;
        panel.querySelector(".polaris-explore").textContent = `Explore ${entry.name.toLowerCase()} ↗`;
        scene.setAttribute("aria-label", entry.name + " details");
        scene.querySelector(".stack").setAttribute("aria-label", entry.name + " card");
        document.title = "Polaris / " + entry.name;
        updateStack();
        reportControls();
      };
      const reportControls = () => {
        const bounds = selector => {
          const element = document.querySelector(selector); if (!element) return null;
          const rect = element.getBoundingClientRect();
          return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
        };
        parent.postMessage({ polarisControls: { close: bounds(".polaris-close"), explore: bounds(".polaris-explore") } }, "*");
      };
      window.addEventListener("resize", reportControls);
      let controlFrames = 0;
      const followTilt = () => { reportControls(); if (--controlFrames > 0) requestAnimationFrame(followTilt); };
      window.addEventListener("pointermove", () => { if (!controlFrames) { controlFrames = 24; requestAnimationFrame(followTilt); } else controlFrames = 24; });
      window.addEventListener("load", reportControls);
      window.addEventListener("message", event => {
        if (event.source === parent && event.data?.polarisModule) applyModule(event.data.polarisModule);
      });
      window.addEventListener("keydown", event => {
        if (event.key === "Escape") parent.postMessage({ polarisClose: true }, "*");
      });
      applyModule({ name: "Roadmap", description: "A living admission plan shaped around your level, timeline, and target universities." });

      scene.classList.add("reveal-enabled");
      updateStack();
      window.addEventListener("keydown", handleGlobalKeyDown);
      window.addEventListener("pointermove", event => {
        if (activeDrag) {
          handleDragPointerMove(activeDrag.card, event);
        }
        handlePointerMove(event);
      });
      window.addEventListener("pointerup", event => {
        if (activeDrag) {
          handlePointerUp(activeDrag.card, event);
        }
      });
      window.addEventListener("pointercancel", cancelDrag);
      window.addEventListener("mouseout", event => {
        if (!event.relatedTarget && !activeDrag) {
          const card = topCard();
          card.shell.classList.remove("is-tracking");
          setShellTransform(card);
        }
      });
      window.addEventListener("focus", () => {
        focused = true;
        syncAnimation();
      });
      window.addEventListener("blur", () => {
        focused = false;
        cancelDrag();
        syncAnimation();
      });
      document.addEventListener("visibilitychange", () => {
        focused = !document.hidden;
        syncAnimation();
      });

      for (const preference of [
        finePointer,
        reducedMotion,
        reducedTransparency,
        forcedColors
      ]) {
        preference.addEventListener?.("change", syncAnimation);
      }

      observer?.observe(scene);
    })();
  </script>
</body>
</html>
